
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: postcard-api
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: postcard-web
spec:
  type: LoadBalancer
  selector:
    app: postcard-web
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postcard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postcard-api
  template:
    metadata:
      labels:
        app: postcard-api
    spec:
      containers:
        - name: api
          image: southbennett/postcard-api:linux
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postcard-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postcard-web
  template:
    metadata:
      labels:
        app: postcard-web
    spec:
      containers:
        - name: web
          image: southbennett/postcard-web:linux